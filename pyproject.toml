[project]
name = "housing-subscription-bot"
version = "1.0.0"
description = "주택청약 정보 디스코드 봇"
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.7.0",
    "fastapi==0.135.1",
    "uvicorn[standard]>=0.34.0",
    "aiohttp>=3.11.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aioresponses>=0.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
