[project]
name = "housing-subscription-bot"
version = "1.0.0"
description = "주택청약 정보 디스코드 봇"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["N802", "N815"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
